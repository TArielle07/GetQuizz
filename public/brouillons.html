<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brouillons</title>

    <!--Police-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

    <!--CSS-->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mes-quiz.css">
</head>
<body>
    <div class="page">

        <!--Header en haut-->
        <header class="header">
            <!--Profil à gauche-->
            <div class="profil">
                <div class="profil-cercle"></div>
                <span class="nom-utilisateur"></span>
            </div>

            <!--Logo au centre-->
            <a href="enseignant.html" class="header-logo">
                <img src="GetQuiz_logo.png" alt="GetQuiz">
            </a>

            <!--Déconnexion à droite-->
            <a href="connexion.html" class="btn-deconnexion">Déconnexion</a>
        </header>
        <!--End header-->

        <main class="main-container">
            <a class="lien-retour" href="enseignant.html">← Retour à l’accueil</a>

            <h1 class="titre-page">
                Terminez vos <span class="mot-accent">brouillons</span> !
            </h1>
            <p class="sous-titre">Terminez les quiz que vous avez commencés.</p>

            <!-- Liste des brouillons : les cartes seront ajoutées ici quand les données existeront -->
            <section class="cartes" id="draft-list" hidden>
            </section>

            <!-- État vide : à masquer quand il y a au moins un brouillon -->
            <section class="carte carte-rose-clair etat-vide" id="draft-empty">
                <div class="etat-vide-icone">✏️</div>
                <h2>Aucun brouillon pour le moment</h2>
                <p class="carte-texte">Les quiz que vous commencez sans les publier seront enregistrés ici.</p>
                <a class="bouton bouton-turquoise" href="creer-quiz.html">+ Créer un quiz</a>
            </section>
        </main>

        <footer class="footer">
            <p class="footer-copy">© 2026 GetQuiz. Tous droits réservés.</p>
        </footer>
    </div>
</body>
</html>

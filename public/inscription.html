<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GetQuizz</title>
</head>
<body>
  <main class="panneau">
    <form id="signup" autocomplete="on">
      <h1>GetQuizz</h1>

      <div class="field">
        <label for="email">Adresse courriel</label>
        <input id="email" name="email" type="email" placeholder="Entrez votre email" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" placeholder="Entrez votre mot de passe" autocomplete="new-password" required>
      </div>

      <button class="signup" type="submit">S'inscrire</button>


      <p class="signin">Avez-vous déja un compte? <a href="#">Se connecter</a></p>
    </form>
  </main>

  <img src="image.avif" alt="Image" width="600">

</body>
</html>
